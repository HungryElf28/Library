services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: VKR_Lib
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - library-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  library-backend:
    build:
      context: ./Library
      dockerfile: Library.Web/Dockerfile
    container_name: library-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=VKR_Lib;Username=postgres;Password=1234
    volumes:
      - backend_uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - library-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend
  library-frontend:
    build:
      context: ./LibraryFront
      dockerfile: Dockerfile
    container_name: library-frontend
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      library-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  backend_uploads:

networks:
  library-network:
    driver: bridge
